<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harbor fixture: cards</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #f3f2ef; }
      main { max-width: 36rem; margin: 2rem auto; display: flex; flex-direction: column; gap: 0.75rem; }
      .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 12px; }
    </style>
  </head>
  <body>
    <!-- Shaped like LinkedIn's top bar: a flex row of list items, each link a small icon-over-label column. -->
    <header class="top"><nav class="topnav"><ul style="display: flex; gap: 1rem; list-style: none; margin: 0; padding: 0.5rem 1rem">
      <li><a href="/feed" style="display: flex; flex-direction: column; align-items: center"><span class="icon">⌂</span><span class="label">Home</span></a></li>
      <li><a href="/jobs" style="display: flex; flex-direction: column; align-items: center"><span class="icon">▣</span><span class="label">Jobs</span></a></li>
      <li><a href="/messages" style="display: flex; flex-direction: column; align-items: center"><span class="icon">✉</span><span class="label">Messaging</span></a></li>
    </ul></nav></header>
    <main>
      <section class="card post"><h2>Ana shipped a release</h2><p>Version 2 is out, with a new editor and faster sync.</p></section>
      <!-- A card whose only content is a promoted block: hiding the block must not leave the empty frame. -->
      <div class="card frame"><div class="frame-inner"><aside class="promo"><h2>Promoted</h2><p>Try Premium free for a month. Cancel any time.</p></aside></div></div>
      <section class="card post"><h2>Ben wrote about caching</h2><p>Three patterns that kept our API fast under load.</p></section>
    </main>
  </body>
</html>
