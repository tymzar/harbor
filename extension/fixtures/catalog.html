<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northfield Outfitters — Backpacks</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: #222; background: #fafaf7; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: #2e3b2f; color: #fff; }
  .bar a { color: #e6efe6; text-decoration: none; }
  .bar input { margin-left: auto; padding: 6px 10px; border-radius: 4px; border: 0; width: 260px; }
  .promo { padding: 8px 20px; background: #f3d36b; font-weight: 600; }
  .wrap { display: grid; grid-template-columns: 200px 1fr; gap: 20px; padding: 20px; }
  .filters div { margin-bottom: 14px; }
  .filters b { display: block; margin-bottom: 4px; }
  .filters label { display: block; font-size: 13px; }
  .sort { display: flex; justify-content: space-between; margin-bottom: 12px; }
  .products { display: flex; flex-wrap: wrap; gap: 14px; }
  .p { width: 190px; background: #fff; border: 1px solid #e3e3dc; border-radius: 6px; padding: 10px; }
  .p .img { height: 110px; border-radius: 4px; margin-bottom: 8px; }
  .p .name { font-weight: 600; }
  .p .price { color: #2e3b2f; margin: 4px 0 8px; }
  .p button { width: 100%; padding: 6px; border: 1px solid #2e3b2f; background: #fff; border-radius: 4px; cursor: pointer; }
  .pages { display: flex; gap: 6px; margin-top: 16px; }
  .pages a { padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; color: #222; text-decoration: none; }
</style>
</head>
<body>
  <div class="bar">
    <strong>Northfield</strong>
    <a href="#">Men</a><a href="#">Women</a><a href="#">Kids</a><a href="#">Packs</a><a href="#">Tents</a><a href="#">Sale</a>
    <input type="search" placeholder="Search products">
    <a href="#">Account</a><a href="#">Cart (2)</a>
  </div>
  <div class="promo">Free shipping over $75 · Returns within 60 days</div>
  <div class="wrap">
    <div class="filters">
      <div><b>Capacity</b><label><input type="checkbox"> Under 20 L</label><label><input type="checkbox"> 20–35 L</label><label><input type="checkbox"> Over 35 L</label></div>
      <div><b>Use</b><label><input type="checkbox"> Daypack</label><label><input type="checkbox"> Commute</label><label><input type="checkbox"> Trekking</label></div>
      <div><b>Price</b><label><input type="checkbox"> Under $80</label><label><input type="checkbox"> $80–150</label><label><input type="checkbox"> Over $150</label></div>
    </div>
    <div>
      <div class="sort"><span>24 backpacks</span><select><option>Featured</option><option>Price: low to high</option></select></div>
      <div class="products">
        <div class="p"><div class="img" style="background:#9bb39a"></div><div class="name">Ridge 28</div><div class="price">$129</div><button>Add to cart</button></div>
        <div class="p"><div class="img" style="background:#c9a77c"></div><div class="name">Commuter 18</div><div class="price">$89</div><button>Add to cart</button></div>
        <div class="p"><div class="img" style="background:#7c95c9"></div><div class="name">Summit 45</div><div class="price">$219</div><button>Add to cart</button></div>
        <div class="p"><div class="img" style="background:#c97c7c"></div><div class="name">Trail 22</div><div class="price">$99</div><button>Add to cart</button></div>
        <div class="p"><div class="img" style="background:#8c8c8c"></div><div class="name">City Sling 8</div><div class="price">$49</div><button>Add to cart</button></div>
        <div class="p"><div class="img" style="background:#a3c97c"></div><div class="name">Alpine 38</div><div class="price">$179</div><button>Add to cart</button></div>
        <div class="p"><div class="img" style="background:#c9c27c"></div><div class="name">Weekender 32</div><div class="price">$149</div><button>Add to cart</button></div>
        <div class="p"><div class="img" style="background:#7cc9be"></div><div class="name">Scout 15</div><div class="price">$59</div><button>Add to cart</button></div>
      </div>
      <div class="pages"><a href="#">1</a><a href="#">2</a><a href="#">3</a><a href="#">Next</a></div>
    </div>
  </div>
</body>
</html>
